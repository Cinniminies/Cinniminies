# Pruebas que no necesitan la base: sintaxis de todo el JS y las pruebas de /admin y de api/.
# Las reglas de Postgres (supabase/tests/reglas.sql) se siguen corriendo a mano contra Supabase.
name: Pruebas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pruebas:
    name: Sintaxis y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # admin/js/ son módulos ES y package.json no dice "type": "module", así que se revisan como módulo
      # por la entrada estándar. El resto (api/, scripts/, cinniminies.js, sw.js) son scripts comunes.
      - name: Revisar la sintaxis del JS
        run: |
          fallas=0
          while read -r archivo; do
            case "$archivo" in
              admin/js/*) node --check --input-type=module < "$archivo" ;;
              *) node --check "$archivo" ;;
            esac || { echo "::error file=$archivo::No pasa node --check"; fallas=1; }
          done < <(git ls-files '*.js' '*.mjs')
          exit $fallas

      # Un patrón de vercel.json que Vercel no acepta frena el deploy sin que falle nada más (pasó con el #103).
      # Se valida con la misma librería que usa Vercel, instalada aparte para no sumarla al package.json.
      - name: Revisar vercel.json
        run: |
          npm install --prefix /tmp/vercel-rutas --no-save @vercel/routing-utils@6.6.1 > /dev/null
          node -e "
            const { getTransformedRoutes } = require('/tmp/vercel-rutas/node_modules/@vercel/routing-utils');
            const { error } = getTransformedRoutes(require('./vercel.json'));
            if (error) { console.log('::error file=vercel.json::' + error.errors.join(' ')); process.exit(1); }
          "

      - name: Pruebas de /admin
        run: node --test admin/tests/*.test.mjs

      - name: Instalar dependencias de api/
        run: npm ci

      - name: Pruebas de api/
        run: node --test api/_tests/*.test.js
